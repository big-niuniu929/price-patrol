<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>矩阵阵列 · 电商平台价格巡检（矩阵版）</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="stylesheet" href="matrix.css">
</head>
<body>
  <div class="bxApp">
    <header class="bxTop">
      <div class="bxBrand">
        <div class="bxLogo"><span>矩</span><i></i></div>
        <div class="bxBrandText">
          <h1>矩阵阵列 <em>· 阵列速采</em></h1>
          <p id="bxSub">等待工作台连接…</p>
        </div>
      </div>

      <div class="bxKpis">
        <div class="bxKpi"><span>批次</span><b id="kBatch">—</b><i id="kBatchHint"></i></div>
        <div class="bxKpi"><span>并发</span><b id="kConc">—</b><i>页面</i></div>
        <div class="bxKpi"><span>本批已读</span><b id="kRead">—</b><i></i></div>
        <div class="bxKpi"><span>累计</span><b id="kDone">—</b><i></i></div>
        <div class="bxKpi ok"><span>成功</span><b id="kOk">0</b><i></i></div>
        <div class="bxKpi bad"><span>失败</span><b id="kFail">0</b><i></i></div>
      </div>

      <div class="bxTopActions">
        <span id="bxPhase" class="bxPhase" data-tone="idle">待命</span>
        <button id="bxClose" class="bxClose" type="button" title="关闭矩阵阵列窗口（Esc）">关闭窗口</button>
      </div>
    </header>

    <main id="bxStage" class="bxStage">
      <canvas id="bxFx" class="bxFx"></canvas>
      <div id="bxCards" class="bxCards"></div>
      <div id="bxAmbient" class="bxAmbient"></div>

      <div id="bxEmpty" class="bxEmpty">
        <div class="bxEmptyMark">⌁</div>
        <b>矩阵速采待命</b>
        <span>在工作台点「⚡ 矩阵速采」后，商品页会在这个窗口里成排打开：批量读取 → 一次写入 → 整排碎成粉末 → 下一批。</span>
      </div>

      <div id="bxSummary" class="bxSummary hidden">
        <div class="bxSummaryCard">
          <span class="bxSummaryK">本轮矩阵速采</span>
          <h2 id="bxSummaryTitle">已完成</h2>
          <div class="bxSummaryNums">
            <div><b id="bxSumDone">0</b><span>采集 SKU</span></div>
            <div class="ok"><b id="bxSumOk">0</b><span>成功</span></div>
            <div class="bad"><b id="bxSumFail">0</b><span>失败</span></div>
            <div><b id="bxSumBatch">0</b><span>批次</span></div>
          </div>
          <p id="bxSummaryHint">回到工作台再点一次「⚡ 矩阵速采」开下一轮。</p>
        </div>
      </div>

      <div id="bxOffline" class="bxOffline hidden">
        <b>工作台已断开</b>
        <span>这个窗口只负责显示阵列动画；请回到工作台继续操作，或关闭此窗口。</span>
      </div>
    </main>

    <footer class="bxFoot">
      <span id="bxFootText">同一套取价规则（content.js）· 整批读取后只写一次存储 · 页面消失时碎成粉末</span>
      <span class="bxFootRight">独立矩阵窗口 · Esc 关闭</span>
    </footer>
  </div>

  <script src="matrix.js"></script>
</body>
</html>
